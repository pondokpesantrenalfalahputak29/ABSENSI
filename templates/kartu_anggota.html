<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartu Anggota — {{ anggota.nama }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    @page { size: 3.375in 2.125in; margin: 0; }
  </style>
</head>
<body>
  <div class="kartu-wrap">
    <div class="kartu-toolbar">
      <a href="{{ url_for('daftar_anggota') }}" class="btn btn-outline"><i class="bi bi-arrow-left"></i> Kembali</a>
      <button onclick="window.print()" class="btn btn-primary"><i class="bi bi-printer-fill"></i> Cetak Kartu</button>
    </div>

    <div class="id-card">
      <div class="header">
        <img src="{{ url_for('static', filename='img/logo.webp') }}" alt="Logo">
        <div class="header-text">
          <div class="instansi">Absensi Pesantren</div>
          <div class="judul-kartu">Kartu Tanda Anggota</div>
        </div>
      </div>
      <div class="body">
        <div class="avatar">{{ anggota.nama[0]|upper }}</div>
        <div class="info">
          <div class="nama">{{ anggota.nama }}</div>
          <div class="detail">
            <div class="baris"><span class="label">NIS</span><span class="nilai">{{ anggota.nis or '-' }}</span></div>
            <div class="baris"><span class="label">Kelas</span><span class="nilai">{{ anggota.kelompok or '-' }}</span></div>
            <div class="baris"><span class="label">Alamat</span><span class="nilai">{{ anggota.alamat or '-' }}</span></div>
          </div>
        </div>
      </div>
      <div class="footer">
        <div class="kode"><small>Kode Kartu</small>{{ anggota.kode_kartu }}</div>
        <div class="qr">
          <img src="data:image/png;base64,{{ qr_b64 }}" alt="QR {{ anggota.kode_kartu }}">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
