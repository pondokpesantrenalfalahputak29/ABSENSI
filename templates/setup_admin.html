<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Awal — Absensi Pesantren</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="{{ url_for('static', filename='img/logo.webp') }}" alt="Logo Pesantren">
      </div>
      <h1>Setup Awal</h1>
      <p class="subtitle">Buat akun admin pertama untuk mengelola sistem ini.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">
              <i class="bi {{ 'bi-check-circle-fill' if category == 'success' else 'bi-exclamation-triangle-fill' }}"></i>
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="field">
          <label for="nama_lengkap"><i class="bi bi-person-badge-fill"></i> Nama Lengkap</label>
          <input type="text" id="nama_lengkap" name="nama_lengkap" required autofocus>
        </div>
        <div class="field">
          <label for="username"><i class="bi bi-person-fill"></i> Username</label>
          <input type="text" id="username" name="username" required>
        </div>
        <div class="field">
          <label for="password"><i class="bi bi-lock-fill"></i> Password</label>
          <input type="password" id="password" name="password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">
          <i class="bi bi-person-plus-fill"></i> Buat Akun Admin
        </button>
      </form>
    </div>
  </div>
</body>
</html>
